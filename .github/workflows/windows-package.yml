name: Windows package

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r packaging/requirements-windows.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executables
        shell: powershell
        run: ./packaging/build_windows.ps1

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/OlgaDeChica.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OlgaDeChica-Windows
          path: release/OlgaDeChica-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/OlgaDeChica-Setup.exe