name: Windows package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get version from Git tag
        shell: powershell
        run: |
          if ("${{ github.ref }}" -match "^refs/tags/v(.+)$") {
              $version = $Matches[1]
          } else {
              $version = "0.0.0-dev"
          }

          "OLGA_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Building Olga de Chica version $version"

      - name: Install dependencies
        run: python -m pip install -r packaging/requirements-windows.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executables
        shell: powershell
        run: ./packaging/build_windows.ps1

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$env:OLGA_VERSION packaging/OlgaDeChica.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OlgaDeChica-Windows-${{ env.OLGA_VERSION }}
          path: release/OlgaDeChica-Setup-${{ env.OLGA_VERSION }}.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/OlgaDeChica-Setup-${{ env.OLGA_VERSION }}.exe