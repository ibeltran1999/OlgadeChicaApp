<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar Filmina</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >
</head>
<body>
    <main class="contenedor">
        <nav class="acciones-principales"><a class="boton" href="/">Inicio</a><a class="boton" href="{{ url_for('filminas.listar_filminas') }}">Consultar Filminas</a></nav>
        <h1>Registrar Filmina</h1>

        {% set datos = datos or {} %}
        {% set seleccionados = seleccionados or [] %}
        {% if error %}
        <p role="alert">{{ error }}</p>
        <p>Revisa los datos. Si adjuntaste un archivo, vuelve a seleccionarlo.</p>
        {% endif %}
        <form
            method="post"
            action="/filminas"
            enctype="multipart/form-data"
        >
            <label for="descripcion">Descripción</label>
            <textarea
                id="descripcion"
                name="descripcion"
                required
            >{{ datos.get("descripcion", "") }}</textarea>

            <label for="fecha">Fecha</label>
            <input
                id="fecha"
                name="fecha"
                type="date"
                value="{{ datos.get('fecha', '') }}"
                required
            >

            <label for="procedencia">Procedencia</label>
            <select id="procedencia" name="procedencia" required>
                <option value="BLAA" {% if datos.get("procedencia") == "BLAA" %}selected{% endif %}>BLAA</option>
                <option value="Archivo Pedro Felipe Hoyos Korvel" {% if datos.get("procedencia") == "Archivo Pedro Felipe Hoyos Korvel" %}selected{% endif %}>
                    Archivo Pedro Felipe Hoyos Korvel
                </option>
            </select>

            <fieldset>
                <legend>Tags</legend>
                {% for numero in range(1, 4) %}
                    <label for="tag_{{ numero }}">Tag {{ numero }}</label>
                    <select id="tag_{{ numero }}" name="tag_identificador">
                        <option value="">Sin tag</option>
                        {% for tag in tags %}
                            <option value="{{ tag.identificador }}" {% if seleccionados|length >= numero and seleccionados[numero - 1] == tag.identificador %}selected{% endif %}>
                                {{ tag.nombre }}
                            </option>
                        {% endfor %}
                    </select>
                {% endfor %}
            </fieldset>

            <label for="archivo">Archivo opcional</label>
            <input
                id="archivo"
                name="archivo"
                type="file"
                accept=".jpg,.cr2,.png,.pdf"
            >

            <button type="submit">Guardar filmina</button>
        </form>
    </main>
</body>
</html>
