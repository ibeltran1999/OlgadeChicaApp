<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Filmina</title>
</head>
<body>
    <h1>Registrar Filmina</h1>

    <form method="post" action="/filminas">
        <label for="descripcion">Descripción</label>
        <textarea
            id="descripcion"
            name="descripcion"
            required
        ></textarea>

        <label for="fecha">Fecha</label>
        <input
            id="fecha"
            name="fecha"
            type="date"
            required
        >

        <label for="precedencia">Procedencia</label>
        <select id="precedencia" name="precedencia" required>
            <option value="BLAA">BLAA</option>
            <option value="Archivo Pedro Felipe Hoyos Korvel">
                Archivo Pedro Felipe Hoyos Korvel
            </option>
        </select>

        <button type="submit">Guardar filmina</button>
    </form>
</body>
</html>
