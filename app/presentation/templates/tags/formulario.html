<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear tag</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >
</head>
<body>
    <main class="contenedor">
        <h1>Crear tag</h1>
        <nav class="acciones-principales" aria-label="Navegación">
            <a class="boton" href="/">Inicio</a>
            <a class="boton" href="{{ url_for('tags.listar') }}">Consultar tags</a>
        </nav>

        <form method="post" action="/tags">
            <label for="identificador">Identificador</label>
            <input
                id="identificador"
                name="identificador"
                type="text"
                required
            >

            <label for="nombre">Nombre</label>
            <input
                id="nombre"
                name="nombre"
                type="text"
                required
            >

            <button type="submit">Guardar tag</button>
        </form>
    </main>
</body>
</html>
