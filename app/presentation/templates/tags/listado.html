<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Consultar tags</title><link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}"></head>
<body><main class="contenedor"><h1>Tags registrados</h1><nav class="acciones-principales"><a class="boton" href="/">Inicio</a><a class="boton" href="{{ url_for('tags.mostrar_formulario') }}">Crear tag</a></nav>
<ul>{% for tag in tags %}<li>{{ tag.identificador }} — {{ tag.nombre }}</li>{% else %}<li>Aún no hay tags registrados.</li>{% endfor %}</ul></main></body></html>
